<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Conversation</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --ink: #1c1e21; --muted: #6b7280;
    --companion: #eef1f5; --participant: #2563eb; --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
  }
  #log {
    flex: 1; overflow-y: auto; padding: 16px 12px 8px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; }
  .companion { background: var(--companion); color: var(--ink); align-self: flex-start; border-bottom-left-radius: 4px; }
  .participant { background: var(--participant); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .code-box {
    align-self: center; background: #fff; border: 2px dashed var(--accent);
    border-radius: 10px; padding: 12px 18px; margin: 8px 0; text-align: center;
  }
  .code-box .code { font-size: 22px; font-weight: 700; letter-spacing: 2px; color: var(--accent); }
  .code-box .hint { font-size: 13px; color: var(--muted); margin-top: 4px; }
  #typing { align-self: flex-start; color: var(--muted); font-size: 14px; padding: 4px 14px; display: none; }
  #bar { display: flex; gap: 8px; padding: 10px 12px 14px; background: var(--panel); border-top: 1px solid #e5e7eb; }
  #inp {
    flex: 1; font: inherit; padding: 10px 14px; border: 1px solid #d1d5db;
    border-radius: 22px; outline: none; resize: none; max-height: 110px;
  }
  #inp:focus { border-color: var(--accent); }
  #send {
    font: inherit; font-weight: 600; color: #fff; background: var(--accent);
    border: 0; border-radius: 22px; padding: 0 18px; cursor: pointer;
  }
  #send:disabled { background: #9db4e8; cursor: default; }
  #err { color: #b91c1c; font-size: 13px; text-align: center; padding: 4px; display: none; }
</style>
</head>
<body>
  <div id="log" aria-live="polite"></div>
  <div id="typing">&hellip;</div>
  <div id="err"></div>
  <div id="bar">
    <textarea id="inp" rows="1" placeholder="Type your message&hellip;" aria-label="Your message"></textarea>
    <button id="send">Send</button>
  </div>

<script>
/* ------------------------------------------------------------------ */
/* CONFIG — set once at deploy                                         */
const WORKER_URL = "https://study1-proxy.shay-y-reynolds.workers.dev";
/* ------------------------------------------------------------------ */

const qs = new URLSearchParams(location.search);
const pid = qs.get("pid") || "";
const cond = qs.get("cond") || "";

const log = document.getElementById("log");
const inp = document.getElementById("inp");
const send = document.getElementById("send");
const typing = document.getElementById("typing");
const err = document.getElementById("err");

let sessionId = null;
let closed = false;
let busy = false;

function bubble(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function showCode(code) {
  const box = document.createElement("div");
  box.className = "code-box";
  box.innerHTML = '<div class="code"></div><div class="hint">Copy this code, then return to the survey window to continue.</div>';
  box.querySelector(".code").textContent = code;
  log.appendChild(box);
  log.scrollTop = log.scrollHeight;
}

function setBusy(b) {
  busy = b;
  send.disabled = b || closed;
  inp.disabled = b || closed;
  typing.style.display = b ? "block" : "none";
  if (!b && !closed) inp.focus();
}

function fail(msg) {
  err.textContent = msg;
  err.style.display = "block";
}

async function post(path, body) {
  const res = await fetch(WORKER_URL + path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

/* Companion messages appear one at a time with a short pause,
   so injected messages read as separate sends. */
function renderReplies(replies, done) {
  let i = 0;
  const step = () => {
    if (i >= replies.length) { done && done(); return; }
    const text = replies[i++];
    bubble(text.replace(/S1-[A-Z2-9]{6}/g, m => m), "companion");
    if (i < replies.length) { typing.style.display = "block"; setTimeout(() => { typing.style.display = "none"; step(); }, 1200); }
    else { done && done(); }
  };
  step();
}

async function start() {
  if (!pid || !cond) { fail("This page must be opened from the survey."); send.disabled = true; inp.disabled = true; return; }
  setBusy(true);
  try {
    const data = await post("/session/start", { pid, condition: cond });
    sessionId = data.session_id;
    bubble(data.opening, "companion");
  } catch (e) {
    fail("Could not start the conversation. Please wait a moment and reload this page.");
  }
  setBusy(false);
}

async function submit() {
  const text = inp.value.trim();
  if (!text || busy || closed || !sessionId) return;
  inp.value = "";
  bubble(text, "participant");
  setBusy(true);
  try {
    const data = await post("/message", { session_id: sessionId, text, client_ts: Date.now() });
    if (data.error) throw new Error(data.error);
    renderReplies(data.replies || [], () => {
      if (data.closed) {
        closed = true;
        showCode(data.completion_code);
        send.disabled = true; inp.disabled = true;
        inp.placeholder = "The conversation has ended.";
      }
      setBusy(false);
    });
    return;
  } catch (e) {
    fail("Message didn't go through. Please try sending it again.");
    setBusy(false);
  }
}

send.addEventListener("click", submit);
inp.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
});
inp.addEventListener("input", () => { err.style.display = "none"; });

start();
</script>
</body>
</html>
